stages:
  - verify
  - release-evidence

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

node:
  stage: verify
  image: node:22.17.1-bookworm-slim
  timeout: 20m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - server/package-lock.json
        - tools/content-validator/package-lock.json
    paths:
      - .npm/
  script:
    - ./verify.sh node

android:
  stage: verify
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  timeout: 30m
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
  cache:
    key:
      files:
        - android/gradle/libs.versions.toml
        - android/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends openjdk-17-jdk-headless
    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
  script:
    - ./verify.sh android

.macos-release-evidence:
  stage: release-evidence
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

ios-build:
  extends: .macos-release-evidence
  timeout: 45m
  script:
    - ./verify.sh ios-build

ios-archive:
  extends: .macos-release-evidence
  timeout: 60m
  script:
    - ./verify.sh ios-archive
